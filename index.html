<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Channels Directory</title>
    <!-- DataTables & Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <style>
        body { padding: 20px; background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .bio-cell { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge-type { text-transform: capitalize; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>دليل قنوات التليجرام</h2>
        <span id="status" class="badge bg-info text-dark">جاري تحميل البيانات...</span>
    </div>
    
    <div class="card shadow-sm p-3">
        <table id="telegramTable" class="table table-striped table-hover w-100">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Type</th>
                    <th>Name</th>
                    <th>Followers</th>
                    <th>Bio</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- JS Dependencies -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
async function loadAllJSON() {
    let allData = [];
    let fileIndex = 1;
    let keepFetching = true;

    // جلب ملفات part_xxxx.json متتالية تلقائياً حتى انتهاء الملفات
    while (keepFetching) {
        const paddedIndex = String(fileIndex).padStart(4, '0');
        const filePath = `output/part_${paddedIndex}.json`;

        try {
            const response = await fetch(filePath);
            if (!response.ok) {
                keepFetching = false;
                break;
            }
            const data = await response.json();
            if (Array.isArray(data) && data.length > 0) {
                allData = allData.concat(data);
                fileIndex++;
            } else {
                keepFetching = false;
            }
        } catch (err) {
            keepFetching = false;
        }
    }

    document.getElementById('status').innerText = `إجمالي النتائج: ${allData.length}`;
    document.getElementById('status').className = "badge bg-success";
    renderTable(allData);
}

function renderTable(data) {
    $('#telegramTable').DataTable({
        data: data,
        columns: [
            { 
                data: "username",
                render: function(data) {
                    if (!data) return '-';
                    const handle = data.replace('@', '');
                    return `<a href="https://t.me/${handle}" target="_blank" class="fw-bold text-decoration-none">@${handle}</a>`;
                }
            },
            { 
                data: "type",
                render: function(data) {
                    const type = data || 'channel';
                    const badgeClass = type === 'channel' ? 'bg-primary' : 'bg-secondary';
                    return `<span class="badge ${badgeClass} badge-type">${type}</span>`;
                }
            },
            { data: "name", defaultContent: "-" },
            { 
                data: "followers",
                defaultContent: 0,
                render: $.fn.dataTable.render.number(',', '.', 0)
            },
            { 
                data: "bio", 
                className: "bio-cell",
                defaultContent: "",
                render: function(data) {
                    if (!data) return '-';
                    const cleanBio = data.replace(/\n/g, ' ');
                    return `<span title="${cleanBio}">${cleanBio}</span>`;
                }
            }
        ],
        order: [[3, 'desc']], // ترتيب تنازلي حسب عدد المتابعين (followers)
        pageLength: 25,
        language: {
            url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/ar.json'
        }
    });
}

$(document.body).ready(function() {
    loadAllJSON();
});
</script>
</body>
</html>
